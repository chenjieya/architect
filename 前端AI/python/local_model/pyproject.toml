[project]
name = "local-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mac:jie.Chen", email = "chenjie.goodday@gmail.com" }
]
requires-python = ">=3.14.5"
dependencies = [
    "jinja2==3.1.6",
    "matplotlib==3.11.0",
    "mcp==1.28.1",
    "numpy==2.5.1",
    "openai==1.74.0",
    "openpyxl>=3.1.5",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "tavily-python==0.7.26",
    "tiktoken==0.13.0",
    "transformers==5.14.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "mypy>=2.3.0",
    "numpy>=2.5.1",
    "pyright>=1.1.411",
    "types-requests>=2.33.0.20260712",
    "types-setuptools>=83.0.0.20260706",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"] # 依赖的构建后端
build-backend = "uv_build"
