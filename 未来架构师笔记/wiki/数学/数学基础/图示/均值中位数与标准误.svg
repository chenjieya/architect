<title id="title">均值、中位数、标准差与均值标准误的对照图</title>
<desc id="desc">第一幅数轴标出数据1、2、9的均值4与中位数2。第二幅对比均值均为70但分散程度不同的两组成绩。第三幅对比正态总体均值70、标准差10时，样本量4和100的均值分布，标准误分别为5与1。</desc>
