<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海绵宝宝 SpongeBob SquarePants</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #006994 0%, #00a5cf 40%, #00c9ff 60%, #90e0ef 100%);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 500px;
            height: 650px;
        }

        /* 泡泡动画 */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.2));
            border: 1px solid rgba(255,255,255,0.4);
            animation: float-up linear infinite;
        }

        @keyframes float-up {
            0% { transform: translateY(0) scale(1); opacity: 0.7; }
            50% { opacity: 1; }
            100% { transform: translateY(-700px) scale(0.5); opacity: 0; }
        }

        .title {
            color: #fff;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        svg {
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        /* 波浪效果 */
        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100px;
            animation: wave-move 3s ease-in-out infinite alternate;
        }

        @keyframes wave-move {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 角色呼吸动画 */
        .character {
            animation: breathe 3s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* 眨眼动画 */
        .eye-right {
            animation: blink 4s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 45%, 55%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }
    </style>
</head>
<body>
    <!-- 泡泡 -->
    <div class="bubble" style="width:20px;height:20px;left:10%;animation-duration:6s;bottom:100px;"></div>
    <div class="bubble" style="width:15px;height:15px;left:20%;animation-duration:8s;bottom:150px;animation-delay:1s;"></div>
    <div class="bubble" style="width:25px;height:25px;left:75%;animation-duration:7s;bottom:120px;animation-delay:2s;"></div>
    <div class="bubble" style="width:18px;height:18px;left:85%;animation-duration:9s;bottom:180px;animation-delay:0.5s;"></div>
    <div class="bubble" style="width:12px;height:12px;left:45%;animation-duration:7.5s;bottom:100px;animation-delay:3s;"></div>
    <div class="bubble" style="width:22px;height:22px;left:60%;animation-duration:8.5s;bottom:140px;animation-delay:1.5s;"></div>

    <h1 class="title">🧽 SpongeBob SquarePants 🧽</h1>

    <div class="container">
        <svg class="character" viewBox="0 0 400 550" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义渐变和滤镜 -->
            <defs>
                <!-- 身体渐变 -->
                <radialGradient id="bodyGrad" cx="50%" cy="40%" r="60%">
                    <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1"/>
                    <stop offset="100%" style="stop-color:#FFC300;stop-opacity:1"/>
                </radialGradient>
                
                <!-- 皮肤高光 -->
                <radialGradient id="shine" cx="30%" cy="30%" r="50%">
                    <stop offset="0%" style="stop-color:#FFF8DC;stop-opacity:0.6"/>
                    <stop offset="100%" style="stop-color:#FFE55C;stop-opacity:0"/>
                </radialGradient>
                
                <!-- 阴影滤镜 -->
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#B8860B" flood-opacity="0.3"/>
                </filter>

                <!-- 孔洞图案 -->
                <pattern id="holes" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
                    <circle cx="15" cy="15" r="5" fill="#E6B800" opacity="0.4"/>
                    <circle cx="45" cy="35" r="4" fill="#E6B800" opacity="0.3"/>
                </pattern>
            </defs>

            <!-- ===== 腿部 ===== -->
            <!-- 左腿 -->
            <line x1="155" y1="380" x2="140" y2="440" stroke="#FFD700" stroke-width="12" stroke-linecap="round"/>
            <!-- 右腿 -->
            <line x1="245" y1="380" x2="260" y2="440" stroke="#FFD700" stroke-width="12" stroke-linecap="round"/>

            <!-- ===== 鞋子 ===== -->
            <!-- 左脚鞋 -->
            <ellipse cx="135" cy="445" rx="25" ry="15" fill="#1a1a1a" />
            <rect x="115" y="430" width="40" height="25" rx="5" fill="#1a1a1a"/>
            <line x1="120" y1="435" x2="150" y2="435" stroke="#333" stroke-width="2"/>
            
            <!-- 右脚鞋 -->
            <ellipse cx="265" cy="445" rx="25" ry="15" fill="#1a1a1a" />
            <rect x="245" y="430" width="40" height="25" rx="5" fill="#1a1a1a"/>
            <line x1="250" y1="435" x2="280" y2="435" stroke="#333" stroke-width="2"/>

            <!-- ===== 手臂 ===== -->
            <!-- 左手臂 - 挥手 -->
            <path d="M 100 230 Q 60 200 50 160" stroke="#FFD700" stroke-width="12" fill="none" stroke-linecap="round">
                <animateTransform attributeName="transform" type="rotate" values="0 100 230;-10 100 230;0 100 230" dur="2s" repeatCount="indefinite"/>
            </path>
            <!-- 左手 -->
            <circle cx="50" cy="158" r="10" fill="#FFD700">
                <animateTransform attributeName="transform" type="rotate" values="0 100 230;-10 100 230;0 100 230" dur="2s" repeatCount="indefinite"/>
            </circle>

            <!-- 右手臂 -->
            <path d="M 300 230 Q 340 210 350 240" stroke="#FFD700" stroke-width="12" fill="none" stroke-linecap="round"/>
            <!-- 右手 -->
            <circle cx="352" cy="242" r="10" fill="#FFD700"/>

            <!-- ===== 身体主体 ===== -->
            <rect x="100" y="120" width="200" height="260" rx="10" fill="url(#bodyGrad)" filter="url(#shadow)"/>
            <!-- 身体纹理 -->
            <rect x="100" y="120" width="200" height="260" rx="10" fill="url(#holes)"/>
            <!-- 身体高光 -->
            <rect x="100" y="120" width="200" height="260" rx="10" fill="url(#shine)"/>

            <!-- ===== 裤子 ===== -->
            <rect x="110" y="330" width="180" height="60" rx="5" fill="#8B4513"/>
            <!-- 裤子腰带 -->
            <rect x="108" y="325" width="184" height="12" rx="3" fill="#654321"/>
            <!-- 皮带扣 -->
            <rect x="185" y="322" width="30" height="18" rx="3" fill="#FFD700" stroke="#B8860B" stroke-width="2"/>
            <!-- 裤缝线 -->
            <line x1="155" y1="337" x2="155" y2="390" stroke="#654321" stroke-width="2"/>
            <line x1="245" y1="337" x2="245" y2="390" stroke="#654321" stroke-width="2"/>
            <!-- 口袋 -->
            <rect x="165" y="345" width="25" height="20" rx="2" fill="none" stroke="#654321" stroke-width="2"/>
            <rect x="210" y="345" width="25" height="20" rx="2" fill="none" stroke="#654321" stroke-width="2"/>

            <!-- ===== 衬衫领子 ===== -->
            <polygon points="160,130 195,165 180,145" fill="white" stroke="#ddd" stroke-width="1"/>
            <polygon points="240,130 205,165 220,145" fill="white" stroke="#ddd" stroke-width="1"/>

            <!-- ===== 领带 ===== -->
            <polygon points="195,165 205,165 210,220 200,230 190,220" fill="#CC0000"/>
            <polygon points="195,165 205,165 200,175" fill="#990000"/>
            <!-- 领带小结 -->
            <polygon points="193,168 207,168 205,175 195,175" fill="#DD0000"/>

            <!-- ===== 头部/面部 ===== -->
            <!-- 大眼睛 -->
            <!-- 左眼白 -->
            <ellipse cx="155" cy="185" rx="30" ry="35" fill="white" stroke="#333" stroke-width="2"/>
            <!-- 左眼珠 -->
            <circle cx="158" cy="188" r="14" fill="#4A90D9"/>
            <circle cx="162" cy="185" r="8" fill="#2C5F8A"/>
            <circle cx="165" cy="180" r="4" fill="white" opacity="0.8"/>
            <circle cx="160" cy="192" r="2" fill="black"/>

            <!-- 右眼 -->
            <ellipse class="eye-right" cx="245" cy="185" rx="30" ry="35" fill="white" stroke="#333" stroke-width="2" style="transform-origin: 245px 185px;">
                <animateTransform attributeName="transform" type="scale" values="1;0.1;1;1" keyTimes="0;0.05;0.1;1" dur="4s" repeatCount="indefinite" additive="sum"/>
            </ellipse>
            <circle class="eye-right" cx="248" cy="188" r="14" fill="#4A90D9" style="transform-origin: 248px 188px;">
                <animateTransform attributeName="transform" type="scale" values="1;0.1;1;1" keyTimes="0;0.05;0.1;1" dur="4s" repeatCount="indefinite" additive="sum"/>
            </circle>
            <circle class="eye-right" cx="252" cy="185" r="8" fill="#2C5F8A" style="transform-origin: 252px 185px;">
                <animateTransform attributeName="transform" type="scale" values="1;0.1;1;1" keyTimes="0;0.05;0.1;1" dur="4s" repeatCount="indefinite" additive="sum"/>
            </circle>
            <circle class="eye-right" cx="255" cy="180" r="4" fill="white" opacity="0.8" style="transform-origin: 255px 180px;">
                <animateTransform attributeName="transform" type="scale" values="1;0.1;1;1" keyTimes="0;0.05;0.1;1" dur="4s" repeatCount="indefinite" additive="sum"/>
            </circle>
            <circle class="eye-right" cx="250" cy="192" r="2" fill="black" style="transform-origin: 250px 192px;">
                <animateTransform attributeName="transform" type="scale" values="1;0.1;1;1" keyTimes="0;0.05;0.1;1" dur="4s" repeatCount="indefinite" additive="sum"/>
            </circle>

            <!-- 长睫毛 - 左眼 -->
            <path d="M 125 160 Q 120 145 115 140" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M 132 148 Q 128 132 125 125" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M 142 142 Q 140 126 140 120" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>

            <!-- 长睫毛 - 右眼 -->
            <path d="M 275 160 Q 280 145 285 140" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M 268 148 Q 272 132 275 125" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M 258 142 Q 260 126 260 120" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>

            <!-- 眉毛 -->
            <path d="M 135 145 Q 155 135 175 142" stroke="#654321" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M 225 142 Q 245 135 265 145" stroke="#654321" stroke-width="3" fill="none" stroke-linecap="round"/>

            <!-- 鼻子 -->
            <ellipse cx="200" cy="205" rx="8" ry="10" fill="#FFD700" stroke="#E6B800" stroke-width="1.5"/>
            <ellipse cx="202" cy="202" rx="3" ry="2" fill="white" opacity="0.5"/>

            <!-- 嘴巴 - 标志性大笑 -->
            <path d="M 140 230 Q 170 270 200 270 Q 230 270 260 230" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
            
            <!-- 嘴唇内部（红色） -->
            <path d="M 145 232 Q 170 268 200 268 Q 230 268 255 232 Q 230 250 200 250 Q 170 250 145 232 Z" fill="#CC3333" opacity="0.7"/>

            <!-- 两颗大门牙 -->
            <rect x="185" y="238" width="14" height="20" rx="2" fill="white" stroke="#ddd" stroke-width="1"/>
            <rect x="201" y="238" width="14" height="20" rx="2" fill="white" stroke="#ddd" stroke-width="1"/>
            <line x1="199" y1="240" x2="199" y2="258" stroke="#eee" stroke-width="1"/>

            <!-- 腮红 -->
            <ellipse cx="130" cy="225" rx="18" ry="12" fill="#FFB6C1" opacity="0.5"/>
            <ellipse cx="270" cy="225" rx="18" ry="12" fill="#FFB6C1" opacity="0.5"/>

            <!-- ===== 头顶头发 ===== -->
            <path d="M 160 125 Q 165 100 170 115 Q 175 95 180 115 Q 185 90 190 112 Q 195 95 200 115 Q 205 88 210 112 Q 215 95 220 118 Q 225 100 230 125" 
                  stroke="#654321" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            
            <!-- 额外发丝 -->
            <path d="M 145 130 Q 150 105 155 120" stroke="#654321" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M 255 130 Q 250 105 245 120" stroke="#654321" stroke-width="2" fill="none" stroke-linecap="round"/>

        </svg>
    </div>

    <!-- 海底波浪装饰 -->
    <svg class="wave" viewBox="0 0 1200 100" preserveAspectRatio="none" style="position:absolute;bottom:0;z-index:-1;">
        <path d="M0,50 C150,80 350,20 500,50 C650,80 850,20 1000,50 C1150,80 1200,50 1200,50 L1200,100 L0,100 Z" 
              fill="rgba(255,255,255,0.2)"/>
        <path d="M0,60 C150,90 350,30 500,60 C650,90 850,30 1000,60 C1150,90 1200,60 1200,60 L1200,100 L0,100 Z" 
              fill="rgba(255,255,255,0.15)"/>
    </svg>

</body>
</html>
