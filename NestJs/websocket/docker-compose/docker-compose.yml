version: "3.9"

services:
  # ======================
  # 后端 NestJS
  # ======================
  nest-backend:
    build:
      context: ../socket-io-chat-room
      dockerfile: Dockerfile
    container_name: nest-backend
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - minio
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6380
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - DB_HOST=mysql
      - DB_PORT=3307
      - DB_DATABASE=nest-chat-production
    networks:
      - app-network

  # ======================
  # 前端 Vue3 + Nginx
  # ======================
  frontend:
    image: nginx:latest
    container_name: vue-frontend
    ports:
      - "5173:80"
    volumes:
      - ../ten_thousand_art_languages_web/dist:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - nest-backend
    networks:
      - app-network

  # ======================
  # Redis
  # ======================
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6380:6379"
    networks:
      - app-network

  # ======================
  # MinIO
  # ======================
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    volumes:
      - minio-data:/data
    networks:
      - app-network

  # ======================
  # MySQL
  # ======================
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chenjie+00
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

volumes:
  minio-data:
  mysql-data:

networks:
  app-network:
    driver: bridge
