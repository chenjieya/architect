version: "3.9"

services:
  # ======================
  # 后端 NestJS
  # ======================
  nest-backend:
    build:
      context: ../socket-io-chat-room
      dockerfile: Dockerfile
    container_name: nest-backend
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - minio
      - mysql
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_HOST=alvis.org.cn
      - MINIO_PORT=9000
      - MINIO_BUCKET=chat-room
      - MINIO_ACCESS_KEY=jie.chen
      - MINIO_SECRET_KEY=chenjie+00
      - MINIO_PUBLIC_HOST=alvis.org.cn
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=nest-chat-production
      - JWT_SECRET=alvis
      - DB_NAME=root
      - DB_PWD=chenjie+00
      - DB_CREATE=true
    networks:
      - app-network

  # ======================
  # 前端 Vue3 + Nginx
  # ======================
  frontend:
    image: nginx:latest
    container_name: vue-frontend
    ports:
      - "5173:80"
    volumes:
      - ../dist:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - nest-backend
    networks:
      - app-network

  # ======================
  # Redis
  # ======================
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6380:6379"
    networks:
      - app-network

  # ======================
  # MinIO
  # ======================
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: jie.chen
      MINIO_ROOT_PASSWORD: chenjie+00
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network

  # ======================
  # MySQL
  # ======================
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: chenjie+00
      MYSQL_DATABASE: nest-chat-production
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

volumes:
  minio-data:
  mysql-data:

networks:
  app-network:
    driver: bridge
